<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Discord Quest Auto</title>
<style>
  html, body { height: 100%; margin: 0; background: #111214; color: #b5bac1;
    font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; }
  .box { text-align: center; }
  .spin { width: 28px; height: 28px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid #2b2d31; border-top-color: #5865f2; animation: r .9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body><div class="box"><div class="spin"></div>Запускаю Discord Quest Auto…</div></body>
</html>

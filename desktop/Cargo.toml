[package]
name = "discord-quest-auto"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Desktop window and tray for Discord Quest Auto"

[[bin]]
name = "discord-quest-auto"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

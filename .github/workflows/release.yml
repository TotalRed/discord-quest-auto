name: Build and test archives
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build Tauri window
        run: cargo build --release --manifest-path desktop/Cargo.toml
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop-out | Out-Null
          Copy-Item desktop/target/release/discord-quest-auto.exe "desktop-out/Discord Quest Auto.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop-out/
  build:
    needs: desktop-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm zip unzip
      - name: Build native runners
        run: |
          rustc assets/runner-linux.rs -O -C target-feature=+crt-static -C strip=symbols -o assets/runner-linux
          clang --target=x86_64-pc-windows-msvc -c -Oz -fno-stack-protector -fno-builtin -o /tmp/runner.obj assets/runner-win.c
          llvm-dlltool -m i386:x86-64 -d assets/kernel32.def -l /tmp/kernel32.lib
          llvm-dlltool -m i386:x86-64 -d assets/user32.def -l /tmp/user32.lib
          lld-link /entry:mainCRTStartup /subsystem:windows /nodefaultlib /out:assets/runner-win.exe /tmp/runner.obj /tmp/kernel32.lib /tmp/user32.lib
      - run: node --test tests/*.test.mjs
      - run: node scripts/download-runtime.mjs
      - run: node scripts/package.mjs linux runtime/linux/node
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: desktop-out
      - run: node scripts/package.mjs windows runtime/windows/node.exe
        env:
          DESKTOP_EXE: desktop-out/Discord Quest Auto.exe
      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: |
            dist/*.zip
            dist/*.sha256
  windows-smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: archives
          path: dist
      - shell: pwsh
        run: |
          $archive = Get-ChildItem dist/*windows-x64.zip | Select-Object -First 1
          Expand-Archive $archive.FullName -DestinationPath extracted
          $app = Get-ChildItem extracted -Directory | Select-Object -First 1
          Copy-Item "$($app.FullName)/assets/runner-win.exe" assets/runner-win.exe
          & "$($app.FullName)/runtime/node.exe" --test tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$($app.FullName)/Discord Quest Auto.exe")) { throw 'Desktop window missing from archive' }
          # The window must start, launch the agent and stay up.
          $env:QUEST_AUTO_DATA_DIR = "$PWD/smoke-data"
          $window = Start-Process "$($app.FullName)/Discord Quest Auto.exe" -PassThru
          $deadline = (Get-Date).AddSeconds(40)
          while (-not (Test-Path "$env:QUEST_AUTO_DATA_DIR/control.json") -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path "$env:QUEST_AUTO_DATA_DIR/control.json")) { throw 'Agent was not started by the window' }
          Start-Sleep 3
          if ($window.HasExited) { throw "Window exited early with code $($window.ExitCode)" }
          $control = Get-Content "$env:QUEST_AUTO_DATA_DIR/control.json" | ConvertFrom-Json
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$($control.port)/api/quit" -Headers @{ Authorization = "Bearer $($control.token)" } | Out-Null
          Stop-Process -Id $window.Id -Force
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: archives
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --prerelease --title "Discord Quest Auto $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
